              - heading "How quickly can you fix a broken AC in Hanford?" [level=3] [ref=e59]
              - paragraph [ref=e60]: During cooling season we target same-day service for no-cooling calls, Monday through Saturday, 7am–8pm. Most common failures — capacitors, contactors, fan motors — are stocked and repaired in a single visit.
            - generic [ref=e61]:
              - heading "How much does AC repair cost in Hanford?" [level=3] [ref=e62]
              - paragraph [ref=e63]: Minor repairs like a failed capacitor or contactor run $150–$450. Refrigerant recharge, fan motor, or control board repairs range from $400–$1,500. A written estimate is provided before any work begins.
            - generic [ref=e64]:
              - heading "Is it worth repairing my old AC or should I replace it?" [level=3] [ref=e65]
              - paragraph [ref=e66]: If your system is under 10 years old and the repair is a few hundred dollars, repair usually makes sense. For 12+ year-old units facing a compressor or coil failure, replacement often costs less over time given the efficiency gain. We give you both numbers, no pressure.
